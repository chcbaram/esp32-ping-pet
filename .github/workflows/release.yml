# 배포 — 태그 v* 를 올리면 펌웨어 · 앱을 빌드해 GitHub Release 를 만든다.
#   수동 실행(workflow_dispatch)은 빌드만 하고 결과를 Actions 아티팩트로 남긴다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF 빌드 + 릴리즈 파일
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: firmware/ping-pet
          command: idf.py build && python tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/ping-pet/dist/*

  app:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            kind: mac
          - os: windows-latest
            kind: win
          - os: ubuntu-22.04
            kind: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/ping-pet/dist
      - name: 의존성
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 맥 dmg
        if: matrix.kind == 'mac'
        run: PYTHON=python bash packaging/build_mac.sh
      - name: 리눅스 AppImage
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2
          PYTHON=python bash packaging/build_linux.sh
      - name: 윈도우 Setup.exe
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          python packaging/make_icons.py
          python -m PyInstaller packaging/ping_pet.spec --noconfirm --distpath packaging/dist --workpath packaging/build/work
          $ver = python -c "import pingpet; print(pingpet.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging/ping_pet.iss
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.kind }}
          path: |
            host/packaging/dist/*.dmg
            host/packaging/dist/*.AppImage
            host/packaging/dist/*Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          FW=$(ls out/ping-pet-fw-*.bin | sed -E 's/.*ping-pet-fw-(.*)\.bin/\1/')
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Ping Pet $GITHUB_REF_NAME (펌웨어 $FW)" \
            --notes-file .github/release-notes.md
